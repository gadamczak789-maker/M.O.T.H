<body>

    <!-- STARTUP SCREEN -->
    <div id="startupScreen">
        <h1 class="bootText">M.O.T.H Initializing...</h1>
    </div>

    <h1 class="title">M.O.T.H</h1>

    <div class="nav">
        <button id="pageSoundboard">Soundboard</button>
        <button id="pageTTS">Spell & Speak</button>
        <button id="pageCharacter">Character</button>
    </div>

    <button id="stopAll">SILENCE</button>

    <!-- SOUND BOARD PAGE -->
    <div id="soundboardPage">
        <div class="grid" id="soundboard"></div>
    </div>

    <!-- SPELL & SPEAK PAGE -->
    <div id="ttsPage" style="display:none;">
        <div class="ttsContainer">
            <div id="ttsOutput" class="ttsOutput"></div>

            <div class="ttsControls">
                <button id="backspace">Backspace</button>
                <button id="clearText">Reset</button>
            </div>

            <div id="wordGrid" class="wordGrid"></div>
            <div class="ttsGrid" id="ttsGrid"></div>
        </div>
    </div>

    <!-- CHARACTER PAGE -->
    <div id="characterPage" style="display:none;">
        <div class="characterCard">
            <h2>M.O.T.H</h2>
            <p><strong>Class:</strong> Artificer</p>
            <p><strong>Level:</strong> 5</p>
            <p><strong>HP:</strong> 38</p>
            <p><strong>AC:</strong> 16</p>

            <h3>Abilities</h3>
            <ul>
                <li>Infusions</li>
                <li>Mechanical Familiar</li>
                <li>Arcane Pulse</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
