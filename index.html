<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.O.T.H</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="bootScreen">M.O.T.H INITIALIZING...</div>

<h1 class="title">M.O.T.H</h1>

<div class="nav">
    <button id="pageSoundboard">Soundboard</button>
    <button id="pageTTS">Spell & Speak</button>
    <button id="pageCharacter">Character</button>
</div>

<button id="stopAll">SILENCE</button>

<!-- SOUND BOARD -->
<div id="soundboardPage">
    <div class="grid" id="soundboard"></div>
</div>

<!-- SPELL & SPEAK -->
<div id="ttsPage" class="hidden">
    <div class="ttsContainer">
        <div id="ttsOutput" class="ttsOutput"></div>

        <div class="ttsControls">
            <button id="backspace">Backspace</button>
            <button id="clearText">Reset</button>
        </div>

        <div id="commonWords" class="grid smallGrid"></div>
        <div id="ttsGrid" class="ttsGrid"></div>
    </div>
</div>

<!-- CHARACTER PAGE -->
<div id="characterPage" class="hidden">
    <div class="characterCard">
        <h2>M.O.T.H</h2>
        <p><strong>Class:</strong> Artificer</p>
        <p><strong>Level:</strong> 5</p>
        <p><strong>HP:</strong> 42</p>

        <h3>Abilities</h3>
        <ul>
            <li>Infuse Item</li>
            <li>Arcane Turret</li>
            <li>Flash of Genius</li>
        </ul>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
