<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.O.T.H</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>

<body>

<div id="bootScreen">M.O.T.H INITIALIZING...</div>

<h1 class="title">M.O.T.H</h1>

<div class="nav">
    <button onclick="showPage('soundboard')">Soundboard</button>
    <button onclick="showPage('tts')">Spell & Speak</button>
    <button onclick="showPage('character')">Character</button>
</div>

<!-- GLOBAL VOLUME -->
<div class="volumeControl">
    🔊 Volume
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
</div>

<button id="stopAll">SILENCE</button>

<!-- SOUND BOARD -->
<div id="soundboardPage">
    <div class="grid" id="soundboard"></div>
</div>

<!-- TTS -->
<div id="ttsPage" class="hidden">
    <div class="ttsContainer">
        <textarea id="ttsInput" placeholder="Enter text..."></textarea>
        <button id="speakBtn">Speak</button>
    </div>
</div>

<!-- CHARACTER -->
<div id="characterPage" class="hidden">
    <div class="characterCard">
        <input id="charName" placeholder="Name">
        <input id="charClass" placeholder="Class">
        <input id="charLevel" placeholder="Level">
        <input id="charHP" placeholder="HP">

        <textarea id="charAbilities" placeholder="Abilities..."></textarea>

        <button id="saveChar">Save</button>
        <button id="loadChar">Load</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
